# Lint, test, and publish to npm.
#
# Publishing uses npm **trusted publishing** (OIDC): no long-lived token is
# stored. The npm trusted publisher for `@dnd-ed/jsshenanigans` must name this
# repository and the workflow file `publish.yml`.
#
# Notes:
#   * npm CLI 11.5.1+ and Node 22.14+ are required. The npm bundled with the
#     runner is too old for scoped-package OIDC, so the publish job upgrades it.
#   * `--provenance` is passed explicitly: it also forces the OIDC auth path.
#   * Publish by creating a GitHub Release (tag it `v1.1.1`, matching
#     `version` in package.json), or run this workflow manually.

name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "22"
          - os: ubuntu-latest
            node: "24"
          # Windows too: a couple of tests spawn child processes.
          - os: windows-latest
            node: "22"
          - os: windows-latest
            node: "24"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - run: npm test

  publish:
    name: publish to npm
    needs: [lint, test]
    runs-on: ubuntu-latest
    # Must match the "Environment name" on the npm trusted publisher config.
    environment: npm
    permissions:
      contents: read
      id-token: write # required for trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24" # npm >= 11.5.1 for OIDC
          registry-url: "https://registry.npmjs.org"

      # The npm bundled with the runner cannot do the OIDC token exchange for
      # scoped packages; upgrade before publishing.
      - run: npm install -g npm@latest
      - run: npm --version

      - name: Verify the version matches the release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${TAG#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::package version '$version' does not match release tag '$tag'"
            exit 1
          fi
          echo "version $version matches tag $tag"

      # No token: the npm CLI authenticates with the OIDC token automatically.
      # `--provenance` makes the OIDC path explicit; `access: public` comes from
      # publishConfig in package.json.
      - run: npm publish --provenance --access public
