# Build, test, publish to npm, and attach nothing fancy.
#
# Publishing uses an npm automation token stored as the `NPM_TOKEN` repository
# secret, and publishes with provenance so the release links back to this
# workflow.
#
# Then publish by creating a GitHub Release (tag it `v1.0.0`, matching
# `version` in package.json).

name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install
      - run: npm run lint

  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "22"
          - os: ubuntu-latest
            node: "24"
          # Windows too: a couple of tests spawn child processes.
          - os: windows-latest
            node: "22"
          - os: windows-latest
            node: "24"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - run: npm test

  publish:
    name: publish to npm
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Verify the version matches the release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${TAG#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::package version '$version' does not match release tag '$tag'"
            exit 1
          fi
          echo "version $version matches tag $tag"

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
